title = "WMKF Apps Gitleaks configuration"
minVersion = "8.25.0"

[extend]
useDefault = true

[[allowlists]]
description = "Public Executor budget Dataverse revision keys in focused unit fixtures."
targetRules = ["generic-api-key"]
condition = "AND"
regexes = ['''^executor\.budgets\.v[0-9]{6}$''']
paths = [
  '''^tests/unit/dataverse-settings-service-odata-escape\.test\.js$''',
  '''^tests/unit/executor-budget-service\.test\.js$''',
  '''^tests/unit/prompt-templates-executor-budgets\.test\.js$''',
]

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public Cycle Dossier activation flag in its rollout documentation; this literal is not a credential."
condition = "AND"
regexes = ['''^CYCLE_DOSSIER_ENABLED=true$''']
paths = ['''^docs/CYCLE_DOSSIER_PILOT_DESIGN\.md$''']

[[allowlists]]
description = "Fixture EXTERNAL_LINK_SECRET values in focused external-token verifier unit tests (never real; set on process.env inside the test)."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = ['''const SECRET = '[a-z0-9-]*test-secret-[a-z0-9-]*';''']
paths = [
  '''^tests/unit/verify-briefing-token\.test\.js$''',
]
