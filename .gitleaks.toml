title = "WMKF Apps Gitleaks configuration"
minVersion = "8.25.0"

[extend]
useDefault = true

[[allowlists]]
description = "Public Executor budget Dataverse revision keys in focused unit fixtures."
targetRules = ["generic-api-key"]
condition = "AND"
regexes = ['''^executor\.budgets\.v[0-9]{6}$''']
paths = [
  '''^tests/unit/dataverse-settings-service-odata-escape\.test\.js$''',
  '''^tests/unit/executor-budget-service\.test\.js$''',
  '''^tests/unit/prompt-templates-executor-budgets\.test\.js$''',
]

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public Cycle Dossier activation flag in its rollout documentation; this literal is not a credential."
condition = "AND"
regexes = ['''^CYCLE_DOSSIER_ENABLED=true$''']
paths = ['''^docs/CYCLE_DOSSIER_PILOT_DESIGN\.md$''']

[[rules.allowlists]]
description = "Test Request Factory live-proof run inspections: SHA-256 digests (idempotency-key digest, Initial Assessment generation keys, bundle/plan/body/file digests) the ledger stores instead of any caller text; never credentials."
condition = "AND"
regexTarget = "line"
regexes = ['''^\s*"(idempotencyKey|generationKey|[A-Za-z]*[Ss]ha256|contentHash|planDigest|copyPolicyDigest|attestedDigest|reviewFilePolicyDigest)": "[0-9a-f]{64}",?$''']
paths = ['''^docs/plans/evidence/test-request-factory/[a-z0-9-]+-run-inspect-[0-9-]+\.json$''']

[[allowlists]]
description = "Fixture EXTERNAL_LINK_SECRET values in focused external-token verifier unit tests (never real; set on process.env inside the test)."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = ['''const SECRET = '[a-z0-9-]*test-secret-[a-z0-9-]*';''']
paths = [
  '''^tests/unit/verify-briefing-token\.test\.js$''',
]

[[rules]]
id = "sumologic-access-token"

[[rules.allowlists]]
description = "Three verified Sandbox rollup FormulaDefinition SHA-256 pins; these exact field/hash pairs are schema fingerprints, not Sumo Logic credentials."
condition = "AND"
regexTarget = "line"
paths = ['''^lib/services/test-requests/sandbox-foundation-verification\.js$''']
regexes = [
  '''^\s*wmkf_sumofdiscretionarygrants: '33a5c1b7aae70d16d0f3fc4343efe463b586d7f30896bf9587af884c72fff080',\s*$''',
  '''^\s*wmkf_sumofprogramgrants: 'e1c725b8fb804568d65daacc223d39bd665ef789cd34b17f81a18c1f873255f7',\s*$''',
  '''^\s*wmkf_sumofprogramgrants_base: '12ae32cb1ec02d01eda3581b127c1fee3b0dc53572ed6baf239721a03d82e126',\s*$''',
]
