<script>
// ---------------------------------------------------------------------------
// FAKE STATE — drives the clickable navigation. Not real data.
// ---------------------------------------------------------------------------
const STATE = {

  scope: 'mine',            // 'mine' | 'mine-or-backup' | 'all'

  wbTab: 'overview',        // workbench area

  cycleOpen: false,
  anno: false,

const CYCLES = ['J26', 'D25', 'J25'];

// Fake request queue (tier-2 rows). Compact-left identity per locked S194 design.

    title:'Sulfur signaling probes for live-cell imaging', scope:'mine', program:'SE',
    stage:'Phase II', actionable:true, action:'2 reviews returned — summarize + draft writeup',
    cand:8, reviewers:{confirmed:3, pending:1, declined:2, returned:2, approved:1, overdue:1, toSend:0} },
  { id:'1002311', cycle:'J26', inst:'Caltech', pi:'Frances Arnold',
    title:'Directed evolution of carbon-fixing enzymes', scope:'mine', program:'SE',
    stage:'Phase II', actionable:true, action:'5 shortlisted — ready to send invitations',
    cand:8, reviewers:{confirmed:0, pending:0, declined:0, returned:0, overdue:0, toSend:5} },
  { id:'1002345', cycle:'J26', inst:'Stanford', pi:'Carolyn Bertozzi',
    title:'Glycan-targeted degraders', scope:'mine-or-backup', program:'MR',
    stage:'Phase II', actionable:false, action:'Awaiting reviewer responses (3 pending)',

// Tier-1 launcher / Tools menu. FAITHFULLY mirrors shared/config/appRegistry.js

const TOOLS = [

  { icon:'🔍', name:'Applicant Integrity Screener',   key:'integrity-screener',       disp:'standalone', wb:null,         desc:'Research-integrity screen (Retraction Watch, PubPeer). Auto-run on the backend; manual here if needed.' },

  // re-homed into the Workbench (standalone form kept for ad-hoc / off-cycle)
  { icon:'🎯', name:'Reviewer Finder',                key:'reviewer-finder',          disp:'rehomed',    wb:'Reviewers',  desc:'AI + DB reviewer discovery.' },
  { icon:'📋', name:'Review Manager',                 key:'review-manager',           disp:'rehomed',    wb:'Reviewers',  desc:'Peer-review lifecycle: send, track, remind, collect.' },
  { icon:'📝', name:'Summarize Peer Reviews',         key:'peer-review-summarizer',   disp:'rehomed',    wb:'Reviews',    desc:'Analyze returned reviews + site-visit questions.' },
  { icon:'✍️', name:'Phase I Writeup',                 key:'phase-i-writeup',          disp:'rehomed',    wb:'Initial Writeup', desc:'Phase I writeup draft.' },
  { icon:'✍️', name:'Phase II Writeup',                key:'phase-ii-writeup',         disp:'rehomed',    wb:'Pre Site Visit Writeup', desc:'Phase II writeup draft + Q&A.' },
  { icon:'🧑‍⚖️', name:'Virtual Review Panel',          key:'virtual-review-panel',     disp:'standalone', wb:null,  beta:true, desc:'Multi-LLM proposal review + synthesis. In development — not part of this cycle.' },
  // infra
  { icon:'⚙️', name:'Admin',                           key:'admin',                    disp:'standalone', wb:null,         desc:'Users, app access, model config, alerts.' },

const DISP_BADGE = {
  'new':        ['new','bg-green-100 text-green-700'],
  'standalone': [null, ''],
  'dual':       ['also a Workbench tab','bg-blue-100 text-blue-700'],
  'rehomed':    ['→ moved into Workbench','bg-indigo-100 text-indigo-700'],
};
function toolsMenuItem(t){
  const [label,cls] = DISP_BADGE[t.disp] || [null,''];
  const badge = label ? `<span class="ml-1 text-[9px] px-1.5 py-0.5 rounded-full font-semibold ${cls}">${label}</span>` : '';
  const beta = t.beta ? `<span class="ml-1 text-[9px] px-1.5 py-0.5 rounded-full font-semibold bg-purple-100 text-purple-700">beta</span>` : '';
  const tab = (t.disp==='rehomed'||t.disp==='dual') && t.wb ? `<span class="ml-1 text-[9px] text-gray-400">↳ ${t.wb} tab</span>` : '';
  return `
    <button onclick="go('tools')" class="w-full text-left px-4 py-2 hover:bg-gray-50 flex items-start gap-3 ${t.disp==='rehomed'?'opacity-80':''}">
      <span class="text-lg leading-none mt-0.5">${t.icon}</span>
      <span class="min-w-0"><span class="text-sm font-medium text-gray-800">${t.name}</span>${beta}${badge}${tab}
      <span class="block text-xs text-gray-500">${t.desc}</span></span>
    </button>`;
}

// Per-request Workbench areas (tier-3). Maps existing apps onto request-scoped tabs.
// kind: auto | refine | human  (from the artifact-categorization in memory)
// phase: v1 | future
const WB_TABS = [
  { key:'overview',  icon:'🗂️', label:'Overview',   kind:null,    phase:'v1',     note:'Request snapshot + what needs the PD now.' },
  { key:'proposal',  icon:'📄', label:'Proposal',   kind:null,    phase:'v1',     note:'In-app proposal viewer. Replaces the SharePoint read-pain workaround.' },
  { key:'initial-writeup', icon:'✍️', label:'Initial Writeup', kind:'refine', phase:'v1', note:'Early writeup draft in the form of a Phase I writeup — reuses the existing Phase I writeup engine. Auto-drafted, PD refines.' },
  { key:'reviewers', icon:'🎯', label:'Reviewers',  kind:'refine',phase:'v1',     note:'THE v1 slice. Find → Invite → Track → Completed. Replaces Finder + Manager.' },
  { key:'reviews',   icon:'📝', label:'Reviews',    kind:'auto',  phase:'future', note:'Returned peer reviews + auto-summary + site-visit questions.' },
  { key:'writeup',   icon:'✍️', label:'Pre Site Visit Writeup', kind:'refine',phase:'future', note:'Writeup draft ahead of the site visit, incorporating returned reviews. Auto-draft skeleton; PD refines. Replaces the filename-keyed Word template.' },
  { key:'sitevisit', icon:'📍', label:'Site Visit', kind:'human', phase:'future', note:'Human-only deliberation notes.' },
  { key:'final-writeup', icon:'📝', label:'Final Writeup', kind:'refine', phase:'future', note:'Final writeup after the site visit, folding in site-visit findings. Auto-draft from the pre-visit writeup; PD refines.' },
  { key:'status',    icon:'📌', label:'Status',     kind:'readonly', phase:'future', note:'Read-only reflection of the proposal\'s own Dynamics lifecycle string (akoya_requeststatus on akoya_request) — a LIVING taxonomy: enumerate live at query time, do not hardcode a value list (per DATAVERSE_POWER_TOOLS_DESIGN). The documented value→class map (probe-derived 2026-05-16) splits Pending-family (Concept / Phase I / Phase II Pending) ⇒ in-flight (probe-clean) from a decided-terminal class (probe-proven examples: Approved, Denied, *Declined, *Ineligible, Closed, *Done) plus a user-attested middle (Active = awarded-in-performance, Proposal Not Invited, Withdrawn — S158, inferred not probe-proven); a value not in the live map ⇒ UNCLASSIFIED, not a guess. Staff recommend; the BOARD decides, recorded in Dynamics elsewhere — not editable here. Distinct from the reviewer-level Completed signal (wmkf_reviewstatus=complete + wmkf_completedat, deployed S196 — record-keeping, no trigger) and from wmkf_phaseiistatus. Tentative placeholder for whatever request-level wrap-up this becomes.' },
];

function req(){ return REQUESTS.find(r => r.id === STATE.requestId); }
function visibleRequests(){
  return REQUESTS.filter(r => {
    if (r.cycle !== STATE.cycle) return false;
    if (STATE.scope === 'mine') return r.scope === 'mine';
    if (STATE.scope === 'mine-or-backup') return r.scope === 'mine' || r.scope === 'mine-or-backup';
    return true;
  });
}

// ---------------------------------------------------------------------------
// NAV ACTIONS
// ---------------------------------------------------------------------------
// State-aware default landing for the Reviewers tab: land on the EARLIEST
// funnel step with outstanding PD work (Invite if candidates are shortlisted
// but unsent, Track if reviewers are invited/in-flight, Completed if reviews
// are back awaiting the PD's sign-off), else Find. (Placeholder heuristic — the
// real rule is the deferred isActionableForPD policy, open item #2.)
function defaultReviewerSub(r, layout){
  const rv = (r && r.reviewers) || {};
  const toSend = rv.toSend||0, pending = rv.pending||0, overdue = rv.overdue||0;
  const invited = (rv.confirmed||0)+pending+(rv.declined||0);
  const awaitingSignoff = (rv.returned||0)-(rv.approved||0);
  if(layout==='3tab'){            // Roster consolidates Invite + Track
    if(toSend>0 || invited>0) return 'roster';
    if(awaitingSignoff>0) return 'completed';
    return 'find';
  }
  if(toSend>0) return 'invite';                  // shortlisted, not yet sent
  if(pending>0 || overdue>0) return 'track';     // invites out, need chasing
  if(awaitingSignoff>0) return 'completed';      // reviews back, need sign-off
  if(invited>0) return 'track';                  // confirmed, awaiting reviews
  return 'find';                                 // nothing started
}
function go(view){ STATE.view = view; STATE.toolsOpen=false; STATE.cycleOpen=false; render(); }
function openRequest(id){ STATE.requestId=id; STATE.reviewerSubTab=defaultReviewerSub(req(), STATE.reviewerLayout); STATE.view='workbench'; STATE.wbTab='overview'; STATE.toolsOpen=false; STATE.cycleOpen=false; render(); }
function setTab(k){ STATE.wbTab=k; render(); }
function setScope(s){ STATE.scope=s; render(); }
function setCycle(c){ STATE.cycle=c; STATE.cycleOpen=false; if(STATE.view==='workbench'){STATE.view='dashboard'; STATE.requestId=null;} render(); }
function toggleTools(){ STATE.toolsOpen=!STATE.toolsOpen; STATE.cycleOpen=false; render(); }
function toggleCycle(){ STATE.cycleOpen=!STATE.cycleOpen; STATE.toolsOpen=false; render(); }
function setReviewerLayout(l){ STATE.reviewerLayout=l; STATE.reviewerSubTab = defaultReviewerSub(req(), l); render(); }
function setReviewerSub(s){ STATE.reviewerSubTab=s; render(); }
function toggleAnno(){ STATE.anno=!STATE.anno; render(); }

// ---------------------------------------------------------------------------
// SMALL RENDER HELPERS
// ---------------------------------------------------------------------------
function annoNote(text){
  return `<div class="anno mt-2 text-xs bg-amber-50 border border-amber-200 text-amber-900 rounded-lg px-3 py-2 leading-relaxed">
    <span class="font-semibold">design&nbsp;note —</span> ${text}</div>`;
}
function annoPin(text){
  return `<span class="anno-pin group relative ml-1 align-middle items-center justify-center w-4 h-4 rounded-full bg-amber-500 text-white text-[9px] font-bold cursor-help">?
    <span class="hidden group-hover:block absolute z-50 left-5 top-0 w-64 bg-amber-900 text-amber-50 text-[11px] rounded-lg px-3 py-2 shadow-xl leading-relaxed normal-case font-normal">${text}</span>
  </span>`;
}
function kindBadge(kind){
  if(!kind) return '';
  const map = {
    auto:  ['Auto','bg-green-100 text-green-800'],
    refine:['Auto-draft · PD refines','bg-blue-100 text-blue-800'],
    human: ['Human-only','bg-purple-100 text-purple-800'],
    readonly:['Read-only · from Dynamics','bg-gray-100 text-gray-700'],
  };
  const [t,c] = map[kind];
  return `<span class="text-[9px] px-1.5 py-0.5 rounded-full font-semibold ${c}">${t}</span>`;
}

// ---------------------------------------------------------------------------
// TIER 1 — GLOBAL BAR (persistent across every view)
// ---------------------------------------------------------------------------
function globalBar(){
  return `

    <div class="max-w-7xl mx-auto px-4 flex items-center gap-3 h-14">
      <!-- brand / home -->
      <button onclick="go('dashboard')" class="flex items-center gap-2 font-bold text-gray-900">
        <span class="text-xl">🔬</span><span class="hidden sm:inline">WMKF&nbsp;Apps</span>
      </button>

      <!-- cycle switcher (tier-2 anchor, always present) -->
      <div class="relative" data-fork="cycle">
        <button onclick="toggleCycle()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-gray-100 hover:bg-gray-200 text-sm font-semibold">
          📅 Cycle: ${STATE.cycle} <span class="text-gray-400">▾</span>
        </button>
        ${STATE.cycleOpen ? `
        <div class="absolute mt-1 w-44 bg-white border border-gray-200 rounded-xl shadow-lg py-1 z-40">
          ${CYCLES.map(c=>`<button onclick="setCycle('${c}')" class="w-full text-left px-4 py-2 text-sm hover:bg-gray-50 ${c===STATE.cycle?'font-bold text-gray-900':'text-gray-600'}">${c} ${c===STATE.cycle?'✓':''}</button>`).join('')}

        </div>`:''}
        ${annoPin('The cycle switcher is the spine of tier-1→tier-2 navigation. It persists everywhere. Switching cycle from inside a Workbench drops you back to that cycle\'s dashboard (context handoff, not a dead end).')}
      </div>

      <div class="flex-1"></div>

      <!-- Tools menu = the DEMOTED launcher (tier-1 standalone apps) -->
      <div class="relative" data-fork="tools">
        <button onclick="toggleTools()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg hover:bg-gray-100 text-sm font-medium text-gray-600">

        ${STATE.toolsOpen ? `
        <div class="absolute right-0 mt-1 w-96 bg-white border border-gray-200 rounded-xl shadow-xl py-2 z-40 max-h-[75vh] overflow-auto">
          <div class="px-4 pt-1 pb-1 text-[10px] uppercase tracking-wide text-gray-400 font-semibold">Standalone &amp; off-cycle</div>
          ${TOOLS.filter(t=>t.disp!=='rehomed').map(toolsMenuItem).join('')}
          <div class="border-t border-gray-100 mt-1 px-4 pt-2 pb-1 text-[10px] uppercase tracking-wide text-gray-400 font-semibold">Now primarily in the Workbench
            <span class="lowercase tracking-normal font-normal text-gray-400"> — standalone form kept for ad-hoc use</span></div>
          ${TOOLS.filter(t=>t.disp==='rehomed').map(toolsMenuItem).join('')}
        </div>`:''}
        ${annoPin('Faithful mirror of appRegistry.js — all 17 registered apps, plus Admin and the new Reviewer Pool. Each is tagged by its fate: standalone (no request context), dual-entry (here AND a Workbench tab, pre-loaded), or re-homed (its primary home is now a per-request tab; the standalone form survives for ad-hoc/off-cycle work). This is the "how every existing app folds in" answer.')}
      </div>

      <!-- user -->
      <div class="flex items-center gap-2 pl-2 border-l border-gray-200">
        <div class="w-8 h-8 rounded-full bg-indigo-500 text-white flex items-center justify-center text-sm font-semibold">JG</div>
        <span class="hidden sm:inline text-sm text-gray-600">PD: J. Gallivan</span>
      </div>
    </div>
  </header>`;
}

// ---------------------------------------------------------------------------
// TIER 2 — CYCLE DASHBOARD (PD landing)
// ---------------------------------------------------------------------------
function dashboardView(){
  const rows = visibleRequests();
  const scopeBtns = [['mine','My (lead PD)'],['mine-or-backup','My (lead or backup)'],['all','All requests']];
  return `
  <div class="max-w-7xl mx-auto px-4 py-6">
    <div class="flex items-center justify-between flex-wrap gap-3 mb-1">
      <h1 class="text-2xl font-bold">Cycle ${STATE.cycle} · Request queue</h1>
      <div class="flex gap-1 bg-gray-100 rounded-lg p-1" data-fork="scope">
        ${scopeBtns.map(([k,l])=>`<button onclick="setScope('${k}')" class="px-3 py-1.5 rounded-md text-sm font-medium ${STATE.scope===k?'bg-white shadow text-gray-900':'text-gray-500'}">${l}</button>`).join('')}
      </div>
    </div>
    <p class="text-sm text-gray-500 mb-4">${rows.length} request${rows.length===1?'':'s'} · sorted by actionability ${annoPin('Default landing for a PD is THIS, not the app launcher. Identity comes from session (dynamics_systemuser_id) — no PD picker. Status filter is the isActionableForPD() policy fn (rules deferred).')}</p>

    ${annoNote('<b>Tier-2 = the home a PD lands on.</b> The flat app launcher is gone from the default path (it lives in the Tools menu now). A PD\'s day starts from "what in my cycle needs me," and drilling into a request is the primary action.')}

    <div class="bg-white border border-gray-200 rounded-xl overflow-hidden mt-4">
      ${rows.length===0?`<div class="p-10 text-center text-gray-400 text-sm">No requests match this scope in ${STATE.cycle}. Try a wider scope.</div>`:''}
      ${rows.map(r=>`
        <button onclick="openRequest('${r.id}')" class="w-full text-left border-b border-gray-100 last:border-0 hover:bg-gray-50 transition flex items-center gap-4 px-4 py-3">
          <!-- compact LEFT identity unit (locked S194/S195) -->
          <div class="w-56 shrink-0" data-fork="identity">
            <div class="text-sm font-mono text-gray-900">#${r.id} <span class="text-gray-400">${r.cycle}</span> <span class="text-[10px] px-1 rounded ${r.program==='MR'?'bg-rose-100 text-rose-700':'bg-sky-100 text-sky-700'}">${r.program}</span></div>
            <div class="text-sm font-medium text-gray-800 truncate">${r.inst}</div>
            <div class="text-xs text-gray-500">PI: ${r.pi}</div>
          </div>
          <!-- middle: title -->
          <div class="flex-1 min-w-0">
            <div class="text-sm text-gray-700 truncate">${r.title}</div>
            <div class="text-xs text-gray-400 mt-0.5">Reviewers: ${r.reviewers.confirmed} confirmed · ${r.reviewers.pending} pending · ${r.reviewers.returned} returned</div>
          </div>
          <!-- RIGHT: actionability cue -->
          <div class="w-72 shrink-0 text-right">
            ${r.actionable
              ? `<span class="inline-block text-[11px] font-semibold text-amber-800 bg-amber-100 rounded-full px-2 py-0.5 mb-1">● action needed</span>`
              : `<span class="inline-block text-[11px] font-semibold text-gray-500 bg-gray-100 rounded-full px-2 py-0.5 mb-1">waiting</span>`}
            <div class="text-xs text-gray-500">${r.action}</div>
            <div class="text-[10px] text-gray-300 mt-0.5">${r.stage}</div>
          </div>
        </button>`).join('')}
    </div>
    ${annoNote('<b>Open fork (S195):</b> row content. Left side compacted into one identity unit (number + cycle on one line, institution above PI). The RIGHT side carries the actionability cue + next-action text. This same compact unit becomes the persistent Workbench header — try clicking a row.')}
  </div>`;
}

// ---------------------------------------------------------------------------

        <div data-fork="identity">

            <span class="text-[10px] px-1.5 py-0.5 rounded ${r.program==='MR'?'bg-rose-100 text-rose-700':'bg-sky-100 text-sky-700'}">${r.program}</span>

          </div>

          <div class="text-xs text-gray-500 max-w-2xl truncate">${r.title}</div>
        </div>
        <button onclick="go('dashboard')" class="text-sm text-gray-500 hover:text-gray-800 hover:underline">← back to ${r.cycle} queue</button>
      </div>
    </div>

    <!-- tier-3 tab strip -->
    <div class="max-w-7xl mx-auto px-4">
      <div class="flex gap-0.5 overflow-x-auto" data-fork="wbtabs">
        ${WB_TABS.map(t=>`
          <button onclick="setTab('${t.key}')" class="shrink-0 flex items-center gap-1.5 px-3 py-2.5 text-sm font-medium border-b-2 ${STATE.wbTab===t.key?'border-indigo-600 text-indigo-700':'border-transparent text-gray-500 hover:text-gray-800'}">
            <span>${t.icon}</span>${t.label}
            ${t.phase==='future'?'<span class="text-[8px] px-1 rounded bg-gray-200 text-gray-500 font-semibold">later</span>':''}
          </button>`).join('')}
      </div>
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-4 py-6">
    ${STATE.anno ? annoNote('<b>Tier-3 = the request is the spine.</b> Every existing per-request app becomes a tab here, pre-loaded with this proposal (no upload). Badges: <span class="text-green-700 font-semibold">Auto</span> = materialized by the backend automation tier; <span class="text-blue-700 font-semibold">Auto-draft·PD refines</span> = generated, PD edits; <span class="text-purple-700 font-semibold">Human-only</span>. "later" = not in v1; the Reviewers tab IS v1.') : ''}
    ${wbPanel(r)}
  </div>`;
}

function wbPanel(r){
  switch(STATE.wbTab){
    case 'reviewers': return reviewersPanel(r);
    case 'overview':  return overviewPanel(r);
    case 'proposal':  return placeholderPanel('proposal');
    default:          return placeholderPanel(STATE.wbTab);
  }
}

function overviewPanel(r){
  return `
  <div class="grid md:grid-cols-3 gap-4">
    <div class="md:col-span-2 space-y-4">
      <div class="bg-white border border-gray-200 rounded-xl p-5">
        <h3 class="font-semibold mb-2">What needs you now</h3>
        <div class="text-sm ${r.actionable?'text-amber-800':'text-gray-500'} flex items-start gap-2">
          <span>${r.actionable?'●':'○'}</span><span>${r.action}</span>
        </div>
        ${r.actionable && STATE.wbTab==='overview' ? `<button onclick="setTab('reviewers')" class="mt-3 text-sm font-semibold text-indigo-600 hover:underline">Go to Reviewers →</button>`:''}
      </div>
      <div class="bg-white border border-gray-200 rounded-xl p-5">
        <h3 class="font-semibold mb-3">Lifecycle progress</h3>
        <div class="flex items-center gap-1 text-xs">
          ${['Submitted','Screened','Reviewers','Reviews in','Writeup','Decision'].map((s,i)=>`
            <div class="flex-1 text-center">
              <div class="h-1.5 rounded-full ${i<=2?'bg-indigo-500':'bg-gray-200'}"></div>
              <div class="mt-1 ${i<=2?'text-indigo-700 font-medium':'text-gray-400'}">${s}</div>
            </div>`).join('')}
        </div>
        ${annoNote('Overview is the main net-new surface among the Workbench tabs — a per-request command center. Most other tabs re-home an existing app; Reviewer Pool (tier-1) is also new. It answers "where is this request and what do I do next."')}
      </div>
    </div>
    <div class="space-y-4">
      <div class="bg-white border border-gray-200 rounded-xl p-5 text-sm">
        <h3 class="font-semibold mb-2">At a glance</h3>
        <dl class="space-y-1 text-gray-600">
          <div class="flex justify-between"><dt>Stage</dt><dd class="font-medium text-gray-900">${r.stage}</dd></div>
          <div class="flex justify-between"><dt>Program</dt><dd class="font-medium text-gray-900">${r.program}</dd></div>
          <div class="flex justify-between"><dt>Reviewers confirmed</dt><dd class="font-medium text-gray-900">${r.reviewers.confirmed} / 3</dd></div>
          <div class="flex justify-between"><dt>Reviews returned</dt><dd class="font-medium text-gray-900">${r.reviewers.returned}</dd></div>
        </dl>
      </div>
    </div>
  </div>`;
}

function placeholderPanel(key){
  const t = WB_TABS.find(x=>x.key===key);
  return `
  <div class="bg-white border border-gray-200 rounded-xl p-8 text-center">
    <div class="text-4xl mb-3">${t.icon}</div>
    <h3 class="text-lg font-semibold flex items-center justify-center gap-2">${t.label} ${kindBadge(t.kind)}</h3>
    <p class="text-sm text-gray-500 max-w-md mx-auto mt-2">${t.note}</p>
    ${t.phase==='future'?`<p class="text-xs text-gray-400 mt-3">Not in v1 — lands as the automation tier matures. URL slot reserved: <span class="font-mono">/workbench/${STATE.requestId}/${key}</span></p>`:''}
    ${annoNote('This is a placeholder. The point of the mockup is the NAVIGATION model — how you get here and how this coexists with the standalone Tools entry. The panel content itself is the existing app, re-homed.')}
  </div>`;
}

// ---- Reviewers tab: the v1 slice, with the 3-tab vs 4-tab fork toggle -------
function reviewersPanel(r){
  const layout4 = [['find','Find'],['invite','Invite'],['track','Track'],['completed','Completed']];
  const layout3 = [['find','Find'],['roster','Roster'],['completed','Completed']];
  const tabs = STATE.reviewerLayout==='4tab' ? layout4 : layout3;
  return `
  <div class="mb-4 flex items-center justify-between flex-wrap gap-3">
    <h2 class="text-lg font-semibold flex items-center gap-2">🎯 Reviewer lifecycle ${kindBadge('refine')}
      <span class="text-[10px] px-1.5 py-0.5 rounded-full bg-indigo-100 text-indigo-700 font-semibold">Workbench v1</span></h2>
    <!-- DECIDED S206: 4-tab + badges. Toggle kept for comparison. -->
    <div class="flex items-center gap-2 text-xs" data-fork="reviewerlayout">
      <span class="text-gray-400">S206 — <span class="text-green-700 font-semibold">decided: 4-tab + badges</span> · compare:</span>
      <div class="flex gap-1 bg-gray-100 rounded-lg p-1">
        <button onclick="setReviewerLayout('4tab')" class="px-2.5 py-1 rounded-md font-semibold ${STATE.reviewerLayout==='4tab'?'bg-white shadow text-green-700':'text-gray-500'}">4-tab ✓</button>
        <button onclick="setReviewerLayout('3tab')" class="px-2.5 py-1 rounded-md font-semibold ${STATE.reviewerLayout==='3tab'?'bg-white shadow text-gray-900':'text-gray-400'}">3-tab</button>
      </div>
    </div>
  </div>

  ${annoNote('<b>Decided (S206): 4-tab + status badges</b> — Find / Invite / Track / Completed. The labels are descriptive (vs. the noun "Roster"), and Invite (compose+send) vs. Track (monitor+chase) are genuinely different modes. The badges on the tab bar (e.g. Track <span class="font-semibold">1 pending · ⚠1</span>, Completed <span class="font-semibold">1 to review · 1 completed</span>) recover the one thing the consolidated Roster did well — at-a-glance "where is everyone" — without losing the descriptive tabs. White space per sub-tab is acceptable at per-request scale. Toggle to compare the old 3-tab Roster.')}

  <div class="bg-white border border-gray-200 rounded-xl overflow-hidden">
    <div class="flex gap-0.5 border-b border-gray-200 px-2 pt-1">
      ${tabs.map(([k,l])=>`<button onclick="setReviewerSub('${k}')" class="px-4 py-2 text-sm font-medium border-b-2 -mb-px flex items-center ${STATE.reviewerSubTab===k?'border-indigo-600 text-indigo-700':'border-transparent text-gray-500 hover:text-gray-800'}">${l}${subBadge(k,r)}</button>`).join('')}
    </div>
    <div class="p-5">${reviewerSubContent(r)}</div>
  </div>`;
}

// Status badges on the reviewer sub-tabs — the tab bar doubles as the at-a-glance
// overview (the one thing the consolidated Roster did well, recovered for 4-tab).
function subBadge(k,r){
  const rv = r.reviewers||{};
  const pill=(t,c)=>`<span class="ml-1.5 text-[9px] px-1.5 py-0.5 rounded-full font-semibold ${c}">${t}</span>`;
  const gray='bg-gray-100 text-gray-600', amber='bg-amber-100 text-amber-800', indigo='bg-indigo-100 text-indigo-700';
  if(k==='find')   return r.cand>0 ? pill(r.cand, gray) : '';
  if(k==='invite') return rv.toSend>0 ? pill(rv.toSend, gray) : '';
  if(k==='track'){ let out=''; if(rv.pending>0) out+=pill(rv.pending+' pending', gray); if(rv.overdue>0) out+=pill('⚠'+rv.overdue, amber); return out; }
  if(k==='roster'){ const active=(rv.confirmed||0)+(rv.pending||0); return active>0?pill(active+' active', gray):''; }
  if(k==='completed'){ const done=rv.approved||0, awaiting=(rv.returned||0)-done; let out=''; if(awaiting>0) out+=pill(awaiting+' to review', amber); if(done>0) out+=pill(done+' completed', 'bg-green-100 text-green-700'); return out; }
  return '';
}

// Sample reviewer name pool — sliced to per-request counts so every sub-panel's
// rows are generated from the SAME data the badges use. Row count then matches
// the tab badge for ANY request (no static-vs-data drift).
const POOL = [
  ['Dr. Aisha Rahman','MIT'], ['Dr. Luca Moretti','ETH Zürich'], ['Dr. Priya Nair','UW–Madison'],
  ['Dr. Sam Okafor','Rice'], ['Dr. Elena Vargas','UC San Diego'], ['Dr. Hiroshi Tanaka','Kyoto'],
  ['Dr. Maya Chen','Caltech'], ['Dr. Omar Haddad','Toronto'], ['Dr. Nadia Khan','Imperial'], ['Dr. Tom Becker','EPFL'],
];
function names(n){ return Array.from({length:Math.max(0,n||0)}, (_,i)=>POOL[i % POOL.length]); }
function emptyState(msg){ return `<div class="text-sm text-gray-400 italic py-8 text-center">${msg}</div>`; }
function rowCard(n, sub, right){
  return `<div class="flex items-center justify-between border border-gray-100 rounded-lg px-3 py-2">
    <div><div class="text-sm font-medium">${n}</div><div class="text-xs text-gray-500">${sub}</div></div>
    ${right}</div>`;
}

function reviewerSubContent(r){
  const sub = STATE.reviewerSubTab;
  const rv = r.reviewers || {};
  if(sub==='find'){
    const rows = names(r.cand);
    return `
    <div class="text-sm text-gray-600 mb-3">AI + database candidate discovery — <b>request-aware</b> (proposal already loaded, no upload). Replaces standalone Reviewer Finder.</div>
    ${rows.length ? `<div class="space-y-2">${rows.map(([n,a],i)=>rowCard(n, `${a} · ${22+((i*7)%28)} relevant pubs`,
        `<div class="flex items-center gap-3"><span class="text-xs font-mono text-green-700">match ${Math.max(0.62,0.95-i*0.03).toFixed(2)}</span><button class="text-xs font-semibold text-indigo-600 hover:underline">+ shortlist</button></div>`)).join('')}</div>`
      : emptyState('No candidates discovered yet — run discovery.')}
    ${annoNote('Find pulls from the Reviewer Pool (the standalone tier-1 app) but scoped to this request. Same data, request-aware entry — the dual-entry principle again. Rows are generated from this request\'s candidate count, so the count matches the Find badge.')}`;
  }
  if(sub==='invite'){
    const rows = names(rv.toSend);
    return `
    <div class="text-sm text-gray-600 mb-3">Shortlisted candidates awaiting dispatch. PD picks 5 (over-invite buffer; need 3 confirmed).</div>
    ${rows.length ? `<div class="space-y-2">${rows.map(([n],i)=>rowCard(n, i%3===2?'draft email':'ready to send',
        `<button class="text-xs font-semibold text-indigo-600 hover:underline">Send invitation</button>`)).join('')}</div>`
      : emptyState('Nothing shortlisted yet — add candidates from Find.')}`;
  }
  if(sub==='track'){
    const inv = names((rv.confirmed||0)+(rv.pending||0)+(rv.declined||0));
    const conf = inv.slice(0, rv.confirmed||0);
    const pend = inv.slice(rv.confirmed||0, (rv.confirmed||0)+(rv.pending||0));
    const decl = inv.slice((rv.confirmed||0)+(rv.pending||0));
    const rows = [
      ...conf.map(([n])=>[n,'✅ confirmed · materials sent','Send reminder']),
      ...pend.map(([n],i)=>[n, i<(rv.overdue||0)?'⏳ pending · ⚠ overdue':'⏳ pending (3d)','Send reminder']),
      ...decl.map(([n])=>[n,'❌ declined','Replace']),
    ];
    return `
    <div class="text-sm text-gray-600 mb-3">Confirmed / pending / declined, materials state, overdue chasing. The badge tracks pending + overdue (the part needing action).</div>
    ${rows.length ? `<div class="space-y-2">${rows.map(([n,s,a])=>rowCard(n,s,`<button class="text-xs font-semibold text-indigo-600 hover:underline">${a}</button>`)).join('')}</div>`
      : emptyState('No reviewers invited yet — send invitations from Invite.')}`;
  }
  if(sub==='roster'){
    const total=(rv.toSend||0)+(rv.confirmed||0)+(rv.pending||0)+(rv.declined||0);
    const nm = names(total); let p=0; const grab=k=>{const s=nm.slice(p,p+(k||0)); p+=(k||0); return s;};
    const rows=[
      ...grab(rv.toSend).map(([n])=>[n,'Shortlisted','—','Send invitation']),
      ...grab(rv.confirmed).map(([n])=>[n,'Confirmed','Sent','Send reminder']),
      ...grab(rv.pending).map(([n],i)=>[n, i<(rv.overdue||0)?'Pending · ⚠ overdue':'Pending (3d)','—','Resend invite']),
      ...grab(rv.declined).map(([n])=>[n,'Declined','—','Replace']),
    ];
    return `
    <div class="text-sm text-gray-600 mb-3">Consolidated roster (3-tab layout): invite + track in one table; actions vary by row state.</div>
    ${rows.length ? `<table class="w-full text-sm">
      <thead><tr class="text-left text-xs text-gray-400 border-b"><th class="py-2">Reviewer</th><th>State</th><th>Materials</th><th class="text-right">Action</th></tr></thead>
      <tbody>${rows.map(([n,s,m,a])=>`<tr class="border-b border-gray-50"><td class="py-2 font-medium">${n}</td><td class="text-gray-600">${s}</td><td class="text-gray-500">${m}</td><td class="text-right"><button class="text-xs font-semibold text-indigo-600 hover:underline">${a}</button></td></tr>`).join('')}</tbody>
    </table>` : emptyState('No reviewers yet — start in Find.')}
    ${annoNote('In 3-tab, this single Roster replaces both Invite and Track. The action column is row-state-driven. Fewer tabs, denser table — compare against the 4-tab split.')}`;
  }
  if(sub==='completed'){
    const ret = names(rv.returned);
    const done = rv.approved||0;
    return `
    <div class="text-sm text-gray-600 mb-3">Per-reviewer: read the returned review and mark it <b>Completed</b>. Completion is record-keeping only — it triggers nothing and does NOT remove the row. The badge shows how many still need your review (amber) + how many are completed (green).</div>
    ${ret.length ? `<div class="space-y-2">${ret.map(([n],i)=> i<done
        ? rowCard(n,'review returned','<span class="text-xs font-semibold text-green-600">✓ completed</span>')
        : rowCard(n,'review returned','<button class="text-xs font-semibold text-indigo-600 hover:underline">mark completed</button>')).join('')}</div>`
      : emptyState('No reviews returned yet.')}
    ${annoNote('<b>"Completed" (was "Approve &amp; Pay" / "Closeout" — settled S206, option a).</b> Maps to existing DEPLOYED fields: wmkf_reviewstatus = complete (100000004) + wmkf_completedat (S196, prod 2026-05-28). NO trigger — payment-eligibility stays on the reviewer-submission signal (wmkf_reviewreceivedat) + staff remit gate; the honorarium link (wmkf_HonorariumRequest) already exists, separately. Completed rows are NOT filtered off the dashboard (this overrides the original S196 drop-off intent) — cycle-scoping handles cleanup, and you can reopen a past cycle to review. Per-REVIEWER; the whole-REQUEST endpoint is the separate read-only Status tab.')}`;
  }
}

// ---------------------------------------------------------------------------
// TOOLS placeholder view (when you click a standalone app)
// ---------------------------------------------------------------------------
function toolsView(){
  return `
  <div class="max-w-7xl mx-auto px-4 py-10 text-center">
    <div class="text-4xl mb-3">🧰</div>
    <h1 class="text-xl font-bold">Standalone tool (tier-1)</h1>
    <p class="text-sm text-gray-500 max-w-lg mx-auto mt-2">This is a standalone app opened from the Tools menu — upload-driven, no request context. Same as today\'s flat-launcher apps.</p>
    ${annoNote('<b>How standalone apps coexist:</b> they keep their independent, off-cycle home in the Tools menu (training, ad-hoc, off-cycle work). The dual-entry ones ALSO appear as a Workbench tab pre-loaded with a request\'s proposal. The launcher isn\'t deleted — it\'s demoted from "the home" to "the toolbox."')}
    <button onclick="go('dashboard')" class="mt-5 px-4 py-2 rounded-lg bg-gray-900 text-white text-sm font-semibold">← Back to cycle dashboard</button>
  </div>`;
}

// ---------------------------------------------------------------------------
// ROOT RENDER
// ---------------------------------------------------------------------------
function render(){
  let body;
  if(STATE.view==='workbench') body = workbenchView();
  else if(STATE.view==='tools') body = toolsView();
  else body = dashboardView();

  document.getElementById('app').innerHTML = globalBar() + body;
  document.body.classList.toggle('anno-on', STATE.anno);
  const btn = document.getElementById('annoToggle');
  btn.textContent = STATE.anno ? '💡 Design notes: ON' : '💡 Design notes: OFF';
  btn.classList.toggle('bg-amber-600', STATE.anno);
}
render();
</script>
