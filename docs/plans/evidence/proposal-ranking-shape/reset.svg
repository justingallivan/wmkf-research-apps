<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" role="img" aria-label="Rebuild with a clear consequence"><style>text{font-family:Inter,Arial,sans-serif}</style><rect width="1280" height="940" fill="#f9fafb"/>
<text x="36" y="32" font-size="13" fill="#6b7280" font-weight="600">PROPOSAL RANKING / SHAPE REVISION 2 / FICTIONAL EXAMPLES</text>
<text x="36" y="77" font-size="28" fill="#111827" font-weight="600">Rebuild with a clear consequence</text>
<text x="36" y="108" font-size="17" fill="#374151" font-weight="400">Combined preparation · An explicit action replaces combined-only changes</text>
<rect x="36" y="148" width="1208" height="84" rx="8" fill="#fffbeb" stroke="#d97706"/>
<text x="57" y="181" font-size="20" fill="#111827" font-weight="600">Your program assessments have changed since this combined list was built.</text>
<text x="57" y="211" font-size="17" fill="#374151" font-weight="400">The earlier combined list stays visible for reference. It cannot be marked ready until rebuilt and reviewed.</text>
<rect x="36" y="255" width="232" height="40" rx="8" fill="#111827" stroke="#d1d5db"/>
<text x="49" y="281" font-size="16" fill="#fff" font-weight="600">Rebuild combined list</text>
<rect x="283" y="255" width="211" height="40" rx="8" fill="#fff" stroke="#d1d5db"/>
<text x="296" y="281" font-size="16" fill="#111827" font-weight="600">Return to programs</text>
<rect x="222" y="337" width="835" height="369" rx="8" fill="#fff" stroke="#d1d5db"/>
<text x="254" y="382" font-size="26" fill="#111827" font-weight="600">Replace your combined assessment?</text>
<text x="254" y="430" font-size="19" fill="#374151" font-weight="400">The new list will use your current MR and SE assessments.</text>
<text x="254" y="468" font-size="19" fill="#374151" font-weight="400">Combined-only changes to order, grades and confidence will be replaced.</text>
<text x="254" y="506" font-size="19" fill="#374151" font-weight="400">You will review the replacement and mark ready again.</text>
<text x="254" y="550" font-size="19" fill="#111827" font-weight="600">Your program preparation stays unchanged.</text>
<rect x="580" y="635" width="106" height="40" rx="8" fill="#fff" stroke="#d1d5db"/>
<text x="593" y="661" font-size="16" fill="#111827" font-weight="600">Cancel</text>
<rect x="702" y="635" width="322" height="40" rx="8" fill="#111827" stroke="#d1d5db"/>
<text x="715" y="661" font-size="16" fill="#fff" font-weight="600">Replace combined assessment</text>
<text x="36" y="775" font-size="19" fill="#111827" font-weight="600">Other resets use equally specific labels and confirmations</text>
<text x="36" y="811" font-size="18" fill="#374151" font-weight="400">Reset program preparation…   /   Reopen preparation after reveal…</text>
<text x="36" y="847" font-size="18" fill="#374151" font-weight="400">Reset collective recommendation…   /   Restart walkthrough…</text>
<text x="36" y="918" font-size="14" fill="#6b7280" font-weight="400">Draft for confirmation · Static layout sketch, not a working interface. Content and motion requirements are in the brief.</text>
</svg>