<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><style>text{font-family:Arial,sans-serif}</style><rect width="1200" height="900" fill="#f9fafb"/><text x="32" y="36" font-size="14" fill="#6b7280" font-weight="600">PROPOSAL RANKING · SHAPE SKETCH · FICTIONAL CONTENT</text><text x="32" y="77" font-size="28" fill="#111827" font-weight="600">Rebuilds and resets are specific actions</text><text x="32" y="109" font-size="18" fill="#374151" font-weight="400">Controls live beside the work they replace; prior revealed versions stay in history</text><rect x="32" y="147" width="1136" height="90" rx="8" fill="#fffbeb" stroke="#d97706"/><text x="52" y="179" font-size="20" fill="#111827" font-weight="600">Your combined list was built before your latest program changes.</text><text x="52" y="211" font-size="18" fill="#374151" font-weight="400">It stays visible for reference. Review a rebuilt list before marking ready.</text><rect x="32" y="258" width="233" height="40" rx="8" fill="#111827" stroke="#d1d5db"/><text x="46" y="284" font-size="16" fill="#ffffff" font-weight="600">Rebuild combined list</text><rect x="283" y="258" width="197" height="40" rx="8" fill="#ffffff" stroke="#d1d5db"/><text x="297" y="284" font-size="16" fill="#111827" font-weight="600">Return to programs</text><rect x="195" y="341" width="810" height="373" rx="12" fill="#ffffff" stroke="#9ca3af"/><text x="229" y="387" font-size="25" fill="#111827" font-weight="600">Replace your combined assessment?</text><text x="229" y="435" font-size="19" fill="#374151" font-weight="400">The new list will use your current MR and SE assessments.</text><text x="229" y="474" font-size="19" fill="#374151" font-weight="400">Combined-only changes to order, grades and confidence</text><text x="229" y="503" font-size="19" fill="#374151" font-weight="400">will be replaced. You will review the list and mark ready again.</text><text x="229" y="551" font-size="19" fill="#111827" font-weight="600">Program preparation stays unchanged.</text><rect x="543" y="637" width="109" height="40" rx="8" fill="#ffffff" stroke="#d1d5db"/><text x="557" y="663" font-size="16" fill="#111827" font-weight="600">Cancel</text><rect x="666" y="637" width="302" height="40" rx="8" fill="#111827" stroke="#d1d5db"/><text x="680" y="663" font-size="16" fill="#ffffff" font-weight="600">Replace combined assessment</text><text x="32" y="775" font-size="18" fill="#111827" font-weight="600">Facilitator round menu</text><text x="32" y="811" font-size="18" fill="#374151" font-weight="400">Reopen preparation…     Reset collective recommendation…     Restart walkthrough…</text><text x="32" y="874" font-size="15" fill="#6b7280" font-weight="400">Draft for discussion — layout intent, not a functioning interface or final visual specification.</text></svg>