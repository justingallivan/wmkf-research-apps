version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      # Major updates are handled deliberately, NOT via automated PRs. A major
      # bump routinely carries breaking changes that break Jest/Playwright, which
      # produced a recurring stream of real CI-failure emails on bot PRs nobody
      # was ready to adapt. Dependabot still proposes grouped minor/patch updates
      # (which stay green and are safe to merge); take majors by hand when wanted.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # (The specific version ignores below are now largely subsumed by the
      # blanket major ignore, but kept as explicit documentation of hard blocks.)
      - dependency-name: "react"
        versions: [">=19"]
      - dependency-name: "react-dom"
        versions: [">=19"]
      - dependency-name: "tailwindcss"
        versions: [">=4"]
      - dependency-name: "pdf-parse"
        versions: [">=2"]
      # 2.17.6 requires Node >=22.12 and its ESM parser chain breaks the current
      # Jest dependency-loading path. Keep the working release until both the
      # CI runtime and Jest loading path are compatible.
      - dependency-name: "sanitize-html"
        versions: ["2.17.6"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
