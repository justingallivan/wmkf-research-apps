name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Docs-only changes (every changed file is Markdown) still run lint and every
  # check:* gate below, but skip the Next build and the full Jest/Postgres
  # suites. Tests read JSON fixtures under docs/, never live .md files, so only
  # *.md counts as docs. Anything unclear (new branch, force push, missing base)
  # counts as code.
  changes:
    name: Detect docs-only change
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base; treating as a code change."
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BASE...$HEAD")
          echo "$changed" | sed 's/^/changed: /'
          if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE '\.md$'; then
            echo "Docs-only change: build and full test suites skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Jest
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:api-routes
      - run: npm run check:atlas
      - run: npm run check:atlas:self-test
      - run: npm run check:doc-currency
      - run: npm run check:doc-currency:self-test
      - run: npm run check:docs-catalog
      - run: npm run check:migrations-manifest
      - run: npm run check:reviewer-reminder-hold
      - run: npm run check:reviewer-reminder-hold:self-test
      - run: npm run check:agent-invariants:ci
      - run: npm run check:instruction-architecture
      - run: npm run check:memory-router
      - run: npm run check:memory-router:self-test
      - run: npm run check:doc-symbol-refs
      - run: npm run check:doc-symbol-refs:self-test
      - run: npm run check:build-claim-freshness
      - run: npm run check:build-claim-freshness:self-test
      - run: npm run check:model-override-warming
      - run: npm run check:model-override-warming:self-test
      - run: npm run check:dataverse-access-layer
      - run: npm run check:dataverse-access-layer:self-test
      - run: npm run check:request-document-writers
      - run: npm run check:request-document-writers:self-test
      - run: npm run check:odata-escape
      - run: npm run check:odata-escape:self-test
      - run: npm run check:dynamics-context-boundary
      - run: npm run check:dynamics-context-boundary:self-test
      - run: npm run check:route-service-boundary
      - run: npm run check:route-service-boundary:self-test
      - run: npm run check:reviewer-engagement-boundary
      - run: npm run check:reviewer-engagement-boundary:self-test
      - run: npm run check:script-suggestion-writers
      - run: npm run check:script-suggestion-writers:self-test
      - run: npm run check:request-meeting-date-reads
      - run: npm run check:request-meeting-date-reads:self-test
      - run: npm run check:route-lifecycle-auth
      - run: npm run check:route-lifecycle-auth:self-test
      - run: npm run check:secret-scan
      - run: npm run check:secret-scan:self-test
      - run: npm run check:scaffolding-tokens
      - run: npm run check:scaffolding-tokens:self-test
      - run: npm run check:harness-framing
      - run: npm run check:harness-framing:self-test
      # Scoped tsc --noEmit over the JSDoc-annotated GUID-selector core
      # (tsconfig.check.json include list). Standalone gate — deliberately
      # decoupled from `next build` (no root tsconfig.json, no .ts files).
      - run: npm run check:types
      # Build re-runs prebuild (build-migrations-manifest); then assert the
      # committed manifest is in sync. Catches "added a migration but forgot
      # to regenerate the manifest" before it reaches prod.
      - run: npm run build
        if: needs.changes.outputs.code == 'true'
      - run: git diff --exit-code lib/db/migrations-manifest.json
        if: needs.changes.outputs.code == 'true'
      - run: npm run test:ci
        if: needs.changes.outputs.code == 'true'

  ledger-postgres:
    # Live PostgreSQL proofs for the Test Request Factory run ledger, the
    # site-visit materials reminder claim, and background-job ownership. The unit
    # fake cannot see SQL grammar or parameter typing (an aggregate FOR UPDATE
    # once passed it), so this suite is REQUIRED here: it fails, not skips,
    # when the connection URL is missing (TEST_REQUEST_LEDGER_REQUIRE=1).
    name: Postgres integration (PostgreSQL 16)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx jest tests/integration/reviewer-acceptance-defaults.pg.test.js tests/integration/test-request-run-ledger.pg.test.js tests/integration/test-request-run-runner.pg.test.js tests/integration/site-visit-materials-claim.pg.test.js tests/integration/site-visit-materials-background-jobs.pg.test.js tests/integration/integrity-screening-reviews.pg.test.js tests/integration/factory-ledger-fingerprint.pg.test.js tests/integration/scheduled-email-engine.pg.test.js tests/integration/final-writeup-handoff-email.pg.test.js tests/integration/final-writeup-leadership-digest.pg.test.js tests/integration/presentation-upload-dismissal.pg.test.js tests/integration/reviewer-materials-release-store.pg.test.js
        env:
          TEST_REQUEST_LEDGER_TEST_URL: postgres://postgres:ledger@127.0.0.1:5432/ledger
          TEST_REQUEST_LEDGER_REQUIRE: '1'
