name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:api-routes
      - run: npm run check:atlas
      - run: npm run check:atlas:self-test
      - run: npm run check:doc-currency
      - run: npm run check:doc-currency:self-test
      - run: npm run check:docs-catalog
      - run: npm run check:migrations-manifest
      - run: npm run check:reviewer-reminder-hold
      - run: npm run check:reviewer-reminder-hold:self-test
      - run: npm run check:agent-invariants:ci
      - run: npm run check:instruction-architecture
      - run: npm run check:memory-router
      - run: npm run check:memory-router:self-test
      - run: npm run check:doc-symbol-refs
      - run: npm run check:doc-symbol-refs:self-test
      - run: npm run check:build-claim-freshness
      - run: npm run check:build-claim-freshness:self-test
      - run: npm run check:model-override-warming
      - run: npm run check:model-override-warming:self-test
      - run: npm run check:dataverse-access-layer
      - run: npm run check:dataverse-access-layer:self-test
      - run: npm run check:request-document-writers
      - run: npm run check:request-document-writers:self-test
      - run: npm run check:odata-escape
      - run: npm run check:odata-escape:self-test
      - run: npm run check:dynamics-context-boundary
      - run: npm run check:dynamics-context-boundary:self-test
      - run: npm run check:route-service-boundary
      - run: npm run check:route-service-boundary:self-test
      - run: npm run check:reviewer-engagement-boundary
      - run: npm run check:reviewer-engagement-boundary:self-test
      - run: npm run check:script-suggestion-writers
      - run: npm run check:script-suggestion-writers:self-test
      - run: npm run check:route-lifecycle-auth
      - run: npm run check:route-lifecycle-auth:self-test
      - run: npm run check:secret-scan
      - run: npm run check:secret-scan:self-test
      - run: npm run check:scaffolding-tokens
      - run: npm run check:scaffolding-tokens:self-test
      - run: npm run check:harness-framing
      - run: npm run check:harness-framing:self-test
      # Scoped tsc --noEmit over the JSDoc-annotated GUID-selector core
      # (tsconfig.check.json include list). Standalone gate — deliberately
      # decoupled from `next build` (no root tsconfig.json, no .ts files).
      - run: npm run check:types
      # Build re-runs prebuild (build-migrations-manifest); then assert the
      # committed manifest is in sync. Catches "added a migration but forgot
      # to regenerate the manifest" before it reaches prod.
      - run: npm run build
      - run: git diff --exit-code lib/db/migrations-manifest.json
      - run: npm run test:ci

  ledger-postgres:
    # Live PostgreSQL proof for the Test Request Factory run ledger. The unit
    # fake cannot see SQL grammar or parameter typing (an aggregate FOR UPDATE
    # once passed it), so this suite is REQUIRED here: it fails, not skips,
    # when the connection URL is missing (TEST_REQUEST_LEDGER_REQUIRE=1).
    name: Run ledger (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx jest tests/integration/test-request-run-ledger.pg.test.js
        env:
          TEST_REQUEST_LEDGER_TEST_URL: postgres://postgres:ledger@127.0.0.1:5432/ledger
          TEST_REQUEST_LEDGER_REQUIRE: '1'
