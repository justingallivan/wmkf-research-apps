name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Skip on Dependabot PRs: they run with no access to repo secrets, so
    # CLAUDE_CODE_OAUTH_TOKEN is empty and the action can't authenticate — a false
    # failure on every bot PR. Reviewing an automated version bump adds no value.
    if: github.actor != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Supply-chain note: the marketplace is fetched from the default branch
          # of the official anthropics/claude-code repo. The plugin system does not
          # support pinning a marketplace source to a commit SHA (branch/tag refs
          # only), so this is an accepted residual trust in that repo; the action
          # itself is pinned to the @v1 release line below.
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Restrict tools (prompt-injection hardening): this runs on every PR, so a
          # malicious instruction in a diff must NOT be able to write files, run
          # arbitrary shell, or exfiltrate over the network. Allow only read/inspect
          # tools + the scoped gh PR/issue commands a review needs to read the diff
          # and post findings. (Excludes Write, Edit, unrestricted Bash, WebFetch.)
          claude_args: '--allowed-tools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

