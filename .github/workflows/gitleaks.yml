name: Secret Scanning

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    # Skip on Dependabot PRs: GitHub runs them with a read-only GITHUB_TOKEN, so
    # gitleaks-action 403s ("Resource not accessible by integration") on its API
    # write-back — a false failure on every bot PR. A dependency/lockfile bump
    # introduces no source secrets, and Trivy's CVE scan already covers those PRs.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
