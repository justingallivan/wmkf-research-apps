name: Security Scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  semgrep:
    name: Static Analysis (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run Semgrep security rulesets
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/default
            p/javascript
            p/react
            p/nextjs
            p/owasp-top-ten
            .semgrep/token-audit.yaml
